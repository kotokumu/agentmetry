syntax = "proto3";

package agentmetry.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kotokumu/agentmetry/gen/agentmetry/v1;agentmetryv1";

// AgentmetryQuery is the read contract shared by the dashboard, Web UI, and
// future generated clients. MCP tools are separate semantic adapters over the
// same application query service; not every RPC is automatically exposed as a
// tool.
service AgentmetryQueryService {
  // Returns bounded dashboard aggregates and recent evidence. It never returns
  // session operation lists.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);

  // Returns bounded session summaries. Operation evidence is loaded separately.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Returns one session summary and its agent topology, without operations.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // Returns server-calculated rework indicators for one source-qualified
  // session. Raw operation bodies and retained OTLP attributes are excluded.
  rpc GetSessionRework(GetSessionReworkRequest) returns (GetSessionReworkResponse);
  // Compares diagnostic evidence from two explicitly selected conversations in one snapshot.
  rpc CompareRework(CompareReworkRequest) returns (CompareReworkResponse);

  // Returns one bounded, cursor-addressed activity page for a session.
  rpc ListSessionActivities(ListSessionActivitiesRequest) returns (ListSessionActivitiesResponse);

  // Returns the bounded trace evidence for one trace ID.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  rpc GetTraceOverview(GetTraceOverviewRequest) returns (GetTraceOverviewResponse);
  rpc GetTraceWindow(GetTraceWindowRequest) returns (GetTraceWindowResponse);

  // Streams bounded invalidation windows for committed read-model changes.
  rpc WatchProjectionChanges(WatchProjectionChangesRequest) returns (stream WatchProjectionChangesResponse);

  // Returns a bounded commit-ordered mutation page for one session.
  rpc SyncSessionActivities(SyncSessionActivitiesRequest) returns (SyncSessionActivitiesResponse);

  // Returns a bounded commit-ordered mutation page for one trace.
  rpc SyncTraceActivities(SyncTraceActivitiesRequest) returns (SyncTraceActivitiesResponse);
}

enum TimeRange {
  TIME_RANGE_UNSPECIFIED = 0;
  TIME_RANGE_ONE_HOUR = 1;
  TIME_RANGE_ONE_DAY = 2;
  TIME_RANGE_SEVEN_DAYS = 3;
}

enum PageDirection {
  PAGE_DIRECTION_UNSPECIFIED = 0;
  PAGE_DIRECTION_OLDER = 1;
  PAGE_DIRECTION_NEWER = 2;
}

message TimeFilter {
  TimeRange range = 1;
  string source_id = 2;
  string search = 3;
}

message PageRequest {
  // Servers may clamp this value. The Agentmetry server caps it at 100.
  int32 page_size = 1;
  // Opaque cursor returned by the server. Clients must not parse it.
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;
  bool has_more = 2;
  string previous_page_token = 3;
  int64 start_offset = 4;
}

message TelemetrySource {
  string id = 1;
  string label = 2;
}

message SignalCounts {
  int64 traces = 1;
  int64 logs = 2;
  int64 metrics = 3;
}

message TokenUsage {
  optional int64 input = 1;
  optional int64 output = 2;
  optional int64 cache_read = 3;
  optional int64 cache_write = 4;
  optional int64 reasoning = 5;
  optional int64 total = 6;
}

message Activity {
  // Stable opaque identity used for idempotent live replacement.
  string id = 29;
  string source = 1;
  string signal = 2;
  string trace_id = 3;
  string span_id = 4;
  string parent_span_id = 5;
  string name = 6;
  string kind = 7;
  string tool_name = 8;
  string target_agent_id = 9;
  string target_agent_type = 10;
  string content = 11;
  string agent_id = 12;
  string agent_definition = 13;
  string agent_type = 14;
  string parent_agent_id = 15;
  string run_id = 16;
  string model = 17;
  google.protobuf.Timestamp started_at = 18;
  google.protobuf.Timestamp ended_at = 19;
  google.protobuf.Timestamp observed_at = 20;
  string status = 21;
  TokenUsage tokens = 22;
  optional double cost_usd = 23;
  bool contributes_to_total = 24;
  string prompt_id = 25;
  string usage_id = 26;
  string related_trace_id = 27;
  string related_span_id = 28;
  ContentEvidence content_evidence = 30;
  // Present for native trace activities returned by GetTraceWindow. False
  // means the parent was retained (or the activity is a root); absent means
  // this relationship was not assessed by the endpoint.
  optional bool missing_parent = 31;
}

// Bounded description of received projected content, never the original
// attributes, body, reference value, or encrypted payload.
message ContentEvidence {
  string source = 1;
  string activity_id = 2;
  string signal = 3;
  string kind = 4;
  string evidence = 5;
  string availability = 6;
  repeated string fields = 7;
  bool truncated = 8;
  string redaction_reason = 9;
}

message AgentSummary {
  string agent_id = 1;
  string agent_definition = 2;
  string agent_type = 3;
  string parent_agent_id = 4;
  string model = 5;
  int64 activity_count = 6;
  TokenUsage tokens = 7;
}

message SessionSummary {
  string id = 1;
  string source_id = 2;
  repeated TelemetrySource sources = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  int64 activity_count = 6;
  TokenUsage tokens = 7;
  optional double cost_usd = 8;
  repeated AgentSummary agents = 9;
  // ListSessions may return this count without loading agent metadata.
  int64 agent_count = 10;
  // List-only relationship metadata; omitted by GetSession.
  SessionCatalog catalog = 11;
}

// Roles describe projected telemetry relationships, not who created a session.
enum SessionRole {
  SESSION_ROLE_UNSPECIFIED = 0;
  SESSION_ROLE_ROOT = 1;
  SESSION_ROLE_CHILD = 2;
}

message SessionCatalog {
  SessionRole role = 1;
  // Related IDs belong to the summary's source_id.
  string root_session_id = 2;
  string parent_session_id = 3;
}

enum SessionListView {
  SESSION_LIST_VIEW_UNSPECIFIED = 0;
  SESSION_LIST_VIEW_ROOTS = 1;
  SESSION_LIST_VIEW_ALL = 2;
}

message Dashboard {
  repeated TelemetrySource sources = 1;
  SignalCounts signal_counts = 2;
  int64 run_count = 3;
  int64 agent_count = 4;
  TokenUsage tokens = 5;
  repeated Activity recent_activity = 6;
  repeated PlanUsageSnapshot plan_usage = 7;
}

message PlanUsageSnapshot {
  string source = 1;
  string account_id = 2;
  string plan = 3;
  string window_id = 4;
  int32 window_duration_minutes = 5;
  double used_percent = 6;
  optional google.protobuf.Timestamp resets_at = 7;
  google.protobuf.Timestamp captured_at = 8;
  string authority = 9;
}

message ActivityAnchor {
  string trace_id = 1;
  string span_id = 2;
}

message GetDashboardRequest {
  TimeFilter filter = 1;
}

message GetDashboardResponse {
  Dashboard dashboard = 1;
}

message ListSessionsRequest {
  TimeFilter filter = 1;
  PageRequest page = 2;
  SessionConditions conditions = 3;
  // Omitted or unspecified preserves the grouped ROOTS view.
  SessionListView view = 4;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
  PageInfo page = 2;
  SessionConditions applied_conditions = 3;
  SessionListView applied_view = 4;
}

message SessionConditions {
  bool observed_failure = 1;
  optional double min_duration_ms = 2;
  optional double max_duration_ms = 3;
  string model = 4;
  string tool = 5;
}

message GetSessionRequest {
  string source_id = 1;
  string session_id = 2;
}

message GetSessionResponse {
  SessionSummary session = 1;
  repeated string trace_ids = 2;
}

message GetSessionReworkRequest {
  string source_id = 1;
  string session_id = 2;
}

message ApiRetryWaste {
  int64 attempts = 1;
  int64 duration_ms = 2;
  TokenUsage tokens = 3;
}

message ReworkMetrics {
  int64 validation_failures = 1;
  int64 fail_fix_retry_cycles = 2;
  int64 rework_duration_ms = 3;
  TokenUsage rework_tokens = 4;
  int64 tool_attempts_with_outcome = 5;
  int64 tool_failures = 6;
  optional double tool_failure_rate = 7;
  ApiRetryWaste api_retry_waste = 8;
  int64 repeated_commands = 9;
  int64 reedited_files = 10;
  int64 total_agent_effort_ms = 11;
  optional double rework_agent_effort_rate = 12;
  int64 validation_attempts_with_outcome = 13;
  int64 first_pass_successes = 14;
  optional double first_pass_success_rate = 15;
  int64 recurring_failure_loops = 16;
  int64 repeated_failure_attempts = 17;
  int64 resolved_failure_loops = 18;
  int64 unresolved_failure_loops = 19;
  int64 failure_resolution_duration_ms = 20;
  TokenUsage failure_resolution_tokens = 21;
  int64 first_pass_eligible_validations = 22;
}

message ReworkCoverage {
  string activity_coverage = 1;
  int64 canonical_events = 2;
  int64 classified_events = 3;
  int64 known_outcomes = 4;
  int64 validation_attempts = 5;
  int64 fingerprinted_failures = 6;
  int64 identified_validation_attempts = 7;
  int64 id_backed_validation_attempts = 8;
  int64 uncorrelated_validation_observations = 9;
  int64 conflicting_attempt_observations = 10;
  int64 merged_validation_attempts = 11;
  int64 ambiguous_failure_attempts = 12;
}

message AnalysisCapability {
  string state = 1;
  string reason = 2;
}

message ReworkCapabilities {
  AnalysisCapability change_revert = 1;
  AnalysisCapability cross_agent_overlap = 2;
}

message RecurringFailureEpisode {
  string agent_id = 1;
  string operation = 2;
  string validation_fingerprint = 3;
  repeated string error_fingerprints = 4;
  int64 failure_attempts = 5;
  bool resolved = 6;
  int64 resolution_duration_ms = 7;
  TokenUsage resolution_tokens = 8;
  string trace_id = 9;
  string span_id = 10;
}

message HarnessIdentity {
  string scope = 1;
  string fingerprint = 2;
  string label = 3;
}

message HarnessEvidenceCounts {
  int64 eligible_records = 1;
  int64 reported_records = 2;
  int64 unreported_records = 3;
  int64 invalid_records = 4;
  int64 distinct_identities = 5;
}

message NoEligibleHarnessEvidence {}
message UnreportedHarnessEvidence {}
message MixedHarnessEvidence {}
message IncompleteHarnessEvidence {}
message InvalidHarnessEvidence {}

message UniformHarnessEvidence {
  HarnessIdentity identity = 1;
}

message HarnessContext {
  HarnessEvidenceCounts counts = 1;
  oneof classification {
    NoEligibleHarnessEvidence no_eligible_records = 2;
    UnreportedHarnessEvidence unreported = 3;
    UniformHarnessEvidence uniform = 4;
    MixedHarnessEvidence mixed = 5;
    IncompleteHarnessEvidence incomplete = 6;
    InvalidHarnessEvidence invalid = 7;
  }
}

message GetSessionReworkResponse {
  string source_id = 1;
  string session_id = 2;
  ReworkMetrics metrics = 3;
  ReworkCoverage coverage = 4;
  ReworkCapabilities capabilities = 5;
  repeated RecurringFailureEpisode failure_episodes = 6;
  HarnessContext harness_context = 7;
  TokenUsage session_tokens = 8;
}

message ReworkComparisonReference {
  string source_id = 1;
  string session_id = 2;
}

message CompareReworkRequest {
  ReworkComparisonReference baseline = 1;
  ReworkComparisonReference current = 2;
}

message ReworkComparisonSummary {
  string source_id = 1;
  string session_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;
  ReworkCoverage coverage = 5;
  string projection_coverage = 6;
  HarnessContext harness_context = 7;
}

message ReworkComparisonValue {
  string availability = 1;
  string reason = 2;
  optional double numerator = 3;
  optional double denominator = 4;
  optional double value = 5;
}

message ReworkComparisonRow {
  string id = 1;
  string unit = 2;
  string availability = 3;
  ReworkComparisonValue baseline = 4;
  ReworkComparisonValue current = 5;
  optional double delta = 6;
}

message CompareReworkResponse {
  string status = 1;
  string code = 2;
  string reason = 3;
  ReworkComparisonSummary baseline = 4;
  ReworkComparisonSummary current = 5;
  repeated ReworkComparisonRow rows = 6;
}

message ListSessionActivitiesRequest {
  string source_id = 1;
  string session_id = 2;
  PageRequest page = 3;
  PageDirection direction = 4;
  ActivityAnchor anchor = 5;
  string agent_id = 6;
}

message ListSessionActivitiesResponse {
  repeated Activity activities = 1;
  PageInfo page = 2;
  int64 total = 3;
}

message GetTraceRequest {
  string trace_id = 1;
  PageRequest page = 2;
  // Returns the newest bounded page for live convergence when no page token is supplied.
  bool live_tail = 3;
  // Returns a bounded page containing this native span, ahead of page position and live_tail.
  string anchor_span_id = 4;
}

message GetTraceResponse {
  string trace_id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp ended_at = 3;
  string status = 4;
  int64 root_span_count = 5;
  int64 missing_parent_count = 6;
  repeated ConversationRef conversations = 7;
  repeated TraceAgent agents = 8;
  repeated Activity activities = 9;
  PageInfo page = 10;
  int64 total_activities = 11;
}

message TraceWindow {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
  string kind = 3;
  bool errors_only = 4;
}

message GetTraceWindowRequest {
  string trace_id = 1;
  TraceWindow window = 2;
  PageRequest page = 3;
}

message GetTraceWindowResponse {
  GetTraceResponse trace = 1;
  int64 matching_activities = 2;
}

message GetTraceOverviewRequest { string trace_id = 1; }

message TraceOverviewActivity {
  string id = 1;
  string source = 2;
  string signal = 3;
  string span_id = 4;
  string parent_span_id = 5;
  string name = 6;
  string kind = 7;
  string status = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp ended_at = 10;
  bool missing_parent = 11;
}

message GetTraceOverviewResponse {
  string trace_id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp ended_at = 3;
  int64 total_activities = 4;
  int64 returned_activities = 5;
  string coverage = 6;
  repeated TraceOverviewActivity activities = 7;
}

enum ProjectionTargetKind {
  PROJECTION_TARGET_KIND_UNSPECIFIED = 0;
  PROJECTION_TARGET_KIND_OVERVIEW = 1;
  PROJECTION_TARGET_KIND_SOURCE = 2;
  PROJECTION_TARGET_KIND_SESSION = 3;
  PROJECTION_TARGET_KIND_TRACE = 4;
  PROJECTION_TARGET_KIND_PLAN_USAGE = 5;
  PROJECTION_TARGET_KIND_ALL_SOURCES = 6;
  PROJECTION_TARGET_KIND_ALL_SESSIONS = 7;
  PROJECTION_TARGET_KIND_ALL_TRACES = 8;
}

message ProjectionChangeTarget {
  ProjectionTargetKind kind = 1;
  string source_id = 2;
  string session_id = 3;
  string trace_id = 4;
}

message WatchProjectionChangesRequest {
  // Opaque cursor from a previous response. Empty starts at the current position.
  string after_cursor = 1;
}

message WatchProjectionChangesResponse {
  // Inclusive end of this contiguous change window.
  string through_cursor = 1;
  repeated ProjectionChangeTarget targets = 2;
  bool resync_required = 3;
  string resync_reason = 4;
}

enum ActivityMutationOperation {
  ACTIVITY_MUTATION_OPERATION_UNSPECIFIED = 0;
  ACTIVITY_MUTATION_OPERATION_UPSERT = 1;
  ACTIVITY_MUTATION_OPERATION_REMOVE = 2;
}

message ActivityMutation {
  ActivityMutationOperation operation = 1;
  string activity_id = 2;
  Activity activity = 3;
}

message SyncSessionActivitiesRequest {
  string source_id = 1;
  string session_id = 2;
  string after_cursor = 3;
  string through_cursor = 4;
  PageRequest page = 5;
}

message SyncTraceActivitiesRequest {
  string trace_id = 1;
  string after_cursor = 2;
  string through_cursor = 3;
  PageRequest page = 4;
}

message SyncSessionActivitiesResponse {
  repeated ActivityMutation mutations = 1;
  string through_cursor = 2;
  PageInfo page = 3;
  bool resync_required = 4;
  string resync_reason = 5;
}

message SyncTraceActivitiesResponse {
  repeated ActivityMutation mutations = 1;
  string through_cursor = 2;
  PageInfo page = 3;
  bool resync_required = 4;
  string resync_reason = 5;
}

message ConversationRef {
  string source_id = 1;
  string id = 2;
}

message TraceAgent {
  string source_id = 1;
  string conversation_id = 2;
  string agent_id = 3;
  string agent_definition = 4;
  string agent_type = 5;
  string parent_agent_id = 6;
  string model = 7;
}
