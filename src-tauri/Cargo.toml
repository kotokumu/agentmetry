[package]
name = "agentmetry-desktop"
version = "0.1.0"
description = "Agentmetry desktop shell"
authors = ["Agentmetry"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
url = "2"
